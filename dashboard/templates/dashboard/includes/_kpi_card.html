{% load dashboard_extras %}

<div class="card kpi-card shadow-sm border-0 h-100">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="{{ icon }} text-{{ color }} fs-4"></i>
          <h6 class="text-muted mb-0 fw-normal" style="font-size: 0.9rem;">
            {{ label }}
            {% if tooltip %}
            <i class="bi bi-info-circle text-muted ms-1"
               data-bs-toggle="tooltip"
               data-bs-placement="top"
               title="{{ tooltip }}"
               style="font-size: 0.85rem; cursor: help;"></i>
            {% endif %}
          </h6>
        </div>
        <h2 class="fw-bold mb-0" style="font-size: 2rem; line-height: 1;">
          {{ value|floatformat:0|default:"0" }}
        </h2>
      </div>

      {% if trend %}
      <div class="text-end">
        {{ trend|trend_badge|safe }}
      </div>
      {% endif %}
    </div>

    {% if description %}
    <p class="text-muted small mb-0">{{ description }}</p>
    {% endif %}

    {% if trend %}
    <div class="mt-2 pt-2 border-top">
      <small class="text-muted">
        <i class="bi bi-clock-history me-1"></i>
        vs 7 derniers jours
      </small>
    </div>
    {% endif %}
  </div>
</div>
