{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIASEC Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


  <!-- Google Fonts + Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


  <link rel="stylesheet" href="{% static 'dashboard/assets/css/custom.css' %}">

  <!-- Initialisation immédiate du thème pour éviter le flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>

  <!--  Structure principale -->
  <div class="layout-wrapper">

    <!-- Sidebar -->
    <aside class="sidenav" id="sidebar">
      <div class="sidebar-header d-flex justify-content-between align-items-center">
        <h3 class="fw-bold text-white mb-0">LIASEC</h3>
        <button class="btn-close-sidebar" id="closeSidebar">
          <span class="material-icons text-white">close</span>
        </button>
      </div>
      {% include 'dashboard/includes/_sidebar.html' %}
    </aside>

    <!-- Contenu principal -->
    <div class="main-content">

      <div class="container-centered">

        <!-- Navbar -->
        <nav class="navbar-main d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <button class="btn-toggle-sidebar me-3" id="toggleSidebar">
              <span class="material-icons">menu</span>
            </button>
          </div>
          {% include 'dashboard/includes/_navbar.html' %}
        </nav>

        <main>
          {% block content %}{% endblock %}
        </main>

      </div>
    </div>

  </div>

  <footer class="footer-simple text-center">
    <div class="container-centered">
      © <script>document.write(new Date().getFullYear())</script>
      <span class="brand-name">LIASEC</span> — Tous droits réservés.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="{% static 'dashboard/assets/js/dashboard_client_charts.js' %}"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const closeSidebar = document.getElementById("closeSidebar");

      const overlay = document.createElement("div");
      overlay.classList.add("overlay");
      document.body.appendChild(overlay);

      toggleSidebar.addEventListener("click", () => {
        sidebar.classList.toggle("sidebar-open");
        overlay.classList.toggle("active");
      });

      closeSidebar.addEventListener("click", () => {
        sidebar.classList.remove("sidebar-open");
        overlay.classList.remove("active");
      });

      overlay.addEventListener("click", () => {
        sidebar.classList.remove("sidebar-open");
        overlay.classList.remove("active");
      });

      // ============================
      // SYSTÈME DE NOTIFICATIONS
      // ============================
      loadNotifications();

      // Rafraîchir toutes les 30 secondes
      setInterval(loadNotifications, 30000);

      // Marquer toutes comme lues
      document.getElementById('markAllReadBtn')?.addEventListener('click', markAllAsRead);
    });

    // Charger les notifications
    function loadNotifications() {
      fetch('{% url "get_notifications_api" %}')
        .then(response => response.json())
        .then(data => {
          const badge = document.getElementById('notificationBadge');
          const list = document.getElementById('notificationsList');

          // Mettre à jour le badge
          if (data.unread_count > 0) {
            badge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
            badge.style.display = 'block';
          } else {
            badge.style.display = 'none';
          }

          // Remplir la liste
          if (data.notifications.length === 0) {
            list.innerHTML = '<div class="text-center py-4 text-muted"><i class="bi bi-bell-slash fs-3 d-block mb-2"></i><small>Aucune notification</small></div>';
          } else {
            list.innerHTML = data.notifications.map(n => createNotificationItem(n)).join('');

            // Ajouter les event listeners
            data.notifications.forEach(n => {
              const item = document.getElementById(`notif-${n.id}`);
              if (item && !n.is_read) {
                item.addEventListener('click', () => markAsRead(n.id));
              }

              // Bouton supprimer
              const deleteBtn = document.getElementById(`delete-notif-${n.id}`);
              if (deleteBtn) {
                deleteBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  deleteNotification(n.id);
                });
              }
            });
          }
        })
        .catch(err => console.error('Erreur chargement notifications:', err));
    }

    // Créer un élément de notification
    function createNotificationItem(n) {
      const typeColors = {
        'info': 'primary',
        'success': 'success',
        'warning': 'warning',
        'error': 'danger',
        'system': 'secondary',
        'export': 'info',
        'analytics': 'primary',
        'user': 'dark'
      };

      const color = typeColors[n.type] || 'primary';
      const readClass = n.is_read ? 'notification-read' : 'notification-unread';
      const timeAgo = getTimeAgo(new Date(n.created_at));

      return `
        <div id="notif-${n.id}" class="notification-item ${readClass} p-3 border-bottom" style="cursor: ${n.is_read ? 'default' : 'pointer'};">
          <div class="d-flex gap-3">
            <div class="notification-icon bg-${color} bg-opacity-10 text-${color} rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width: 40px; height: 40px;">
              <i class="${n.icon} fs-5"></i>
            </div>
            <div class="flex-grow-1" style="min-width: 0;">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <h6 class="mb-0 fw-semibold" style="font-size: 0.875rem;">${n.title}</h6>
                <button id="delete-notif-${n.id}" class="btn btn-sm btn-link text-muted p-0 ms-2" style="font-size: 1.2rem; line-height: 1;" title="Supprimer">
                  <i class="bi bi-x"></i>
                </button>
              </div>
              <p class="mb-1 text-muted" style="font-size: 0.8rem; line-height: 1.4;">${n.message}</p>
              <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted" style="font-size: 0.75rem;">
                  <i class="bi bi-clock me-1"></i>${timeAgo}
                </small>
                ${n.action_url ? `<a href="${n.action_url}" class="btn btn-sm btn-${color} btn-sm" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">${n.action_label || 'Voir'}</a>` : ''}
              </div>
              ${!n.is_read ? '<div class="notification-dot"></div>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    // Calculer le temps écoulé
    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);

      if (seconds < 60) return 'À l\'instant';
      if (seconds < 3600) return `Il y a ${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `Il y a ${Math.floor(seconds / 3600)} h`;
      if (seconds < 604800) return `Il y a ${Math.floor(seconds / 86400)} j`;
      return date.toLocaleDateString('fr-FR');
    }

    // Marquer une notification comme lue
    function markAsRead(id) {
      fetch(`/dashboard/api/notifications/${id}/read/`, { method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') }})
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            loadNotifications();
          }
        });
    }

    // Marquer toutes comme lues
    function markAllAsRead() {
      fetch('{% url "mark_all_notifications_read" %}', { method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') }})
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            loadNotifications();
          }
        });
    }

    // Supprimer une notification
    function deleteNotification(id) {
      fetch(`/dashboard/api/notifications/${id}/delete/`, { method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') }})
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            loadNotifications();
          }
        });
    }

    // Helper CSRF
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    // ============================
    // SYSTÈME DE THÈME (DARK MODE) - VERSION SIMPLIFIÉE
    // ============================
    (function() {
      const themeToggle = document.getElementById('themeToggle');
      const html = document.documentElement;

      // Charger le thème sauvegardé ou détecter la préférence système
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

      // Appliquer le thème initial
      html.setAttribute('data-theme', initialTheme);

      // Toggle du thème
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const currentTheme = html.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

          html.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);

          // Animation du bouton
          themeToggle.style.transform = 'rotate(360deg)';
          setTimeout(() => {
            themeToggle.style.transform = 'rotate(0deg)';
          }, 300);
        });
      }

      // Écouter les changements de préférence système
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
          html.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      });
    })();

    // ============================
    // FORCE STYLES SUR TOUS LES KPI CARDS (SOLUTION ULTRA-RADICALE)
    // ============================
    function forceKPIStyles() {
      const theme = document.documentElement.getAttribute('data-theme');

      // Supprimer l'ancien style s'il existe
      const oldStyle = document.getElementById('force-kpi-styles');
      if (oldStyle) {
        oldStyle.remove();
      }

      // Créer une nouvelle balise style avec des règles ultra-spécifiques
      const styleTag = document.createElement('style');
      styleTag.id = 'force-kpi-styles';

      if (theme === 'dark') {
        styleTag.textContent = `
          /* MODE SOMBRE - Règles injectées dynamiquement avec priorité MAXIMALE ABSOLUE */
          html[data-theme="dark"] .kpi-card,
          html[data-theme="dark"] .metric-card,
          html[data-theme="dark"] .card.kpi-card,
          html[data-theme="dark"] .card.metric-card,
          html[data-theme="dark"] div.card.kpi-card,
          html[data-theme="dark"] div.card.metric-card,
          html[data-theme="dark"] .card.border-0.shadow-sm.h-100.kpi-card,
          html[data-theme="dark"] .card.border-0.shadow-sm.text-center.p-3.metric-card,
          html[data-theme="dark"] .card.text-center.p-2.shadow-sm.kpi-card,
          html[data-theme="dark"] .card.text-center.p-2,
          html[data-theme="dark"] #kpi-sessions,
          html[data-theme="dark"] #kpi-chatbot,
          html[data-theme="dark"] #kpi-consultations,
          html[data-theme="dark"] #kpi-clics {
            background-color: #161b22 !important;
            background: #161b22 !important;
            border-color: #30363d !important;
            color: #e6edf3 !important;
          }

          html[data-theme="dark"] .kpi-card .card-body,
          html[data-theme="dark"] .metric-card .card-body,
          html[data-theme="dark"] .card.kpi-card .card-body,
          html[data-theme="dark"] .card.metric-card .card-body {
            background-color: transparent !important;
            background: transparent !important;
            color: #e6edf3 !important;
          }

          /* Titres par défaut */
          html[data-theme="dark"] .kpi-card h1, html[data-theme="dark"] .kpi-card h2,
          html[data-theme="dark"] .kpi-card h3, html[data-theme="dark"] .kpi-card h4,
          html[data-theme="dark"] .metric-card h1, html[data-theme="dark"] .metric-card h2,
          html[data-theme="dark"] .metric-card h3, html[data-theme="dark"] .metric-card h4,
          html[data-theme="dark"] .card.kpi-card h1, html[data-theme="dark"] .card.kpi-card h2,
          html[data-theme="dark"] .card.kpi-card h3, html[data-theme="dark"] .card.kpi-card h4,
          html[data-theme="dark"] .card.metric-card h1, html[data-theme="dark"] .card.metric-card h2 {
            color: #e6edf3 !important;
          }

          /* Couleurs spécifiques pour les textes - MODE SOMBRE */
          html[data-theme="dark"] .kpi-card .text-primary,
          html[data-theme="dark"] .metric-card .text-primary,
          html[data-theme="dark"] .card.kpi-card .text-primary {
            color: #60a5fa !important; /* Bleu clair pour mode sombre */
          }

          html[data-theme="dark"] .kpi-card .text-success,
          html[data-theme="dark"] .metric-card .text-success,
          html[data-theme="dark"] .card.kpi-card .text-success {
            color: #34d399 !important; /* Vert clair pour mode sombre */
          }

          html[data-theme="dark"] .kpi-card .text-info,
          html[data-theme="dark"] .metric-card .text-info,
          html[data-theme="dark"] .card.kpi-card .text-info {
            color: #38bdf8 !important; /* Cyan clair pour mode sombre */
          }

          html[data-theme="dark"] .kpi-card .text-warning,
          html[data-theme="dark"] .metric-card .text-warning,
          html[data-theme="dark"] .card.kpi-card .text-warning {
            color: #fbbf24 !important; /* Jaune clair pour mode sombre */
          }

          html[data-theme="dark"] .kpi-card .text-danger,
          html[data-theme="dark"] .metric-card .text-danger,
          html[data-theme="dark"] .card.kpi-card .text-danger {
            color: #f87171 !important; /* Rouge clair pour mode sombre */
          }

          html[data-theme="dark"] .kpi-card .text-muted,
          html[data-theme="dark"] .metric-card .text-muted,
          html[data-theme="dark"] .card.kpi-card .text-muted,
          html[data-theme="dark"] .card.metric-card .text-muted,
          html[data-theme="dark"] .kpi-card p.text-muted,
          html[data-theme="dark"] .metric-card p.text-muted {
            color: #7d8590 !important;
          }

          html[data-theme="dark"] .kpi-card small,
          html[data-theme="dark"] .metric-card small,
          html[data-theme="dark"] .card.kpi-card small,
          html[data-theme="dark"] .card.metric-card small {
            color: #9198a1 !important;
          }
        `;
      } else {
        styleTag.textContent = `
          /* MODE CLAIR - Règles injectées dynamiquement */
          html[data-theme="light"] .kpi-card,
          html[data-theme="light"] .metric-card,
          html[data-theme="light"] .card.kpi-card,
          html[data-theme="light"] .card.metric-card,
          html[data-theme="light"] div.card.kpi-card,
          html[data-theme="light"] div.card.metric-card,
          html[data-theme="light"] .card.border-0.shadow-sm.h-100.kpi-card,
          html[data-theme="light"] .card.border-0.shadow-sm.text-center.p-3.metric-card,
          html[data-theme="light"] .card.text-center.p-2.shadow-sm.kpi-card,
          html[data-theme="light"] #kpi-sessions,
          html[data-theme="light"] #kpi-chatbot,
          html[data-theme="light"] #kpi-consultations,
          html[data-theme="light"] #kpi-clics {
            background-color: #ffffff !important;
            background: #ffffff !important;
            border-color: #dee2e6 !important;
            color: #1a1a1a !important;
          }

          html[data-theme="light"] .kpi-card .card-body,
          html[data-theme="light"] .metric-card .card-body,
          html[data-theme="light"] .card.kpi-card .card-body,
          html[data-theme="light"] .card.metric-card .card-body {
            background-color: transparent !important;
            background: transparent !important;
            color: #1a1a1a !important;
          }

          /* Titres par défaut */
          html[data-theme="light"] .kpi-card h1, html[data-theme="light"] .kpi-card h2,
          html[data-theme="light"] .kpi-card h3, html[data-theme="light"] .kpi-card h4,
          html[data-theme="light"] .metric-card h1, html[data-theme="light"] .metric-card h2,
          html[data-theme="light"] .metric-card h3, html[data-theme="light"] .metric-card h4 {
            color: #1a1a1a !important;
          }

          /* Couleurs spécifiques pour les textes - MODE CLAIR */
          html[data-theme="light"] .kpi-card .text-primary,
          html[data-theme="light"] .metric-card .text-primary,
          html[data-theme="light"] .card.kpi-card .text-primary {
            color: #0d6efd !important; /* Bleu Bootstrap */
          }

          html[data-theme="light"] .kpi-card .text-success,
          html[data-theme="light"] .metric-card .text-success,
          html[data-theme="light"] .card.kpi-card .text-success {
            color: #198754 !important; /* Vert Bootstrap */
          }

          html[data-theme="light"] .kpi-card .text-info,
          html[data-theme="light"] .metric-card .text-info,
          html[data-theme="light"] .card.kpi-card .text-info {
            color: #0dcaf0 !important; /* Cyan Bootstrap */
          }

          html[data-theme="light"] .kpi-card .text-warning,
          html[data-theme="light"] .metric-card .text-warning,
          html[data-theme="light"] .card.kpi-card .text-warning {
            color: #ffc107 !important; /* Jaune Bootstrap */
          }

          html[data-theme="light"] .kpi-card .text-danger,
          html[data-theme="light"] .metric-card .text-danger,
          html[data-theme="light"] .card.kpi-card .text-danger {
            color: #dc3545 !important; /* Rouge Bootstrap */
          }

          html[data-theme="light"] .kpi-card .text-muted,
          html[data-theme="light"] .metric-card .text-muted,
          html[data-theme="light"] .card.kpi-card .text-muted,
          html[data-theme="light"] .card.metric-card .text-muted {
            color: #6b7280 !important;
          }

          html[data-theme="light"] .kpi-card small,
          html[data-theme="light"] .metric-card small,
          html[data-theme="light"] .card.kpi-card small,
          html[data-theme="light"] .card.metric-card small {
            color: #4a5568 !important;
          }
        `;
      }

      // Injecter dans le head (priorité maximale car chargé en dernier)
      document.head.appendChild(styleTag);

      console.log(`[DARK MODE] Injected dynamic styles for theme: ${theme}`);

      // Sélectionner TOUS les KPI cards et metric cards
      const allCards = document.querySelectorAll('.kpi-card, .metric-card, .card.kpi-card, .card.metric-card, .card.text-center.p-2, .card.text-center.shadow-sm.kpi-card');

      console.log(`[DARK MODE] Found ${allCards.length} cards`);

      // Forcer un reflow pour que les styles s'appliquent immédiatement
      allCards.forEach(card => {
        // Forcer le navigateur à recalculer les styles
        void card.offsetHeight;

        // Vérifier l'application
        const computedBg = window.getComputedStyle(card).backgroundColor;
        console.log(`[DARK MODE] Card BG after injection:`, computedBg);
      });
    }

    // Appliquer au chargement du DOM
    document.addEventListener('DOMContentLoaded', function() {
      // Appliquer immédiatement
      forceKPIStyles();

      // Réappliquer après un court délai pour capturer les éléments chargés dynamiquement
      setTimeout(forceKPIStyles, 100);
      setTimeout(forceKPIStyles, 300);

      // Observer les changements de thème
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
            // Petit délai pour laisser les transitions CSS se faire
            setTimeout(forceKPIStyles, 50);
          }
        });
      });

      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });

      // Observer aussi l'ajout de nouveaux éléments au DOM
      const bodyObserver = new MutationObserver(function(mutations) {
        let shouldReapply = false;
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1 && (node.classList.contains('kpi-card') || node.classList.contains('metric-card') || node.querySelector('.kpi-card') || node.querySelector('.metric-card'))) {
                shouldReapply = true;
              }
            });
          }
        });
        if (shouldReapply) {
          forceKPIStyles();
        }
      });

      bodyObserver.observe(document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>

</body>
</html>
